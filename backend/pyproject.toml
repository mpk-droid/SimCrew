[project]
name = "synthetic-users"
version = "0.1.0"
description = "AI synthetic users microservice — configurable persona-driven testing"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Muthukumaran PK"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.0",
    "anthropic[vertex]>=0.40",
    "httpx>=0.27",
    "docker>=7.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
k8s = ["kubernetes>=31.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
