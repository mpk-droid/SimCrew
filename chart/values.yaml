replicaCount: 1

serviceAccount:
  name: ""

image:
  repository: quay.io/rh-ee-mpk/simcrew
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8000

route:
  enabled: true
  tls:
    termination: edge

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: "1"

healthCheck:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 30

env:
  SU_ROLE: orchestrator
  MODEL: nvidia/nemotron-3-ultra-550b-a55b

agent:
  image:
    repository: quay.io/rh-ee-mpk/simcrew
    tag: latest
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: "2"
  timeout: 1800

postgresql:
  enabled: true
  auth:
    database: simcrew
    username: simcrew
    password: simcrew
  primary:
    persistence:
      size: 1Gi

secrets:
  anthropicApiKey: ""
  vertexProjectId: ""
  vertexRegion: ""
  modelsCorpApiKey: ""
  modelsCorpUrl: ""
  nvidiaApiKey: ""
  nvidiaNimBaseUrl: "https://integrate.api.nvidia.com/v1"
  nvidiaNimModel: "nvidia/nemotron-3-ultra-550b-a55b"
  nvidiaNimFallbackModel: "nvidia/nemotron-3-super-120b-a12b"
  nvidiaNimEnableThinking: "false"
