image:
  repository: ghcr.io/mpk-droid/simcrew
  tag: latest
  pullPolicy: Always

# Image for persona agent pods. Defaults to `image` above.
agent:
  image: ""
  # Seconds to wait for all personas in a run to finish before failing it.
  runTimeout: 1800

service:
  port: 8000

route:
  enabled: true
  host: ""
  tls:
    termination: edge

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: "1"

healthCheck:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 30

serviceAccount:
  create: true
  name: ""

postgresql:
  enabled: true
  image: quay.io/sclorg/postgresql-16-c9s:latest
  auth:
    database: simcrew
    username: simcrew
    # Empty: generated on install and kept across upgrades.
    password: ""
  persistence:
    size: 1Gi
    storageClass: ""

# Used when postgresql.enabled is false, e.g.
# postgresql+asyncpg://user:pass@host:5432/db
externalDatabaseUrl: ""

# Agent pods run code from the repos they evaluate. This keeps them off the
# cluster network: they can reach the orchestrator, DNS, and public internet.
networkPolicy:
  enabled: true
  # CIDRs agents may reach despite being private, e.g. an internal LLM endpoint.
  extraEgressCIDRs: []

secrets:
  nvidiaApiKey: ""
  nvidiaNimBaseUrl: "https://integrate.api.nvidia.com/v1"
  nvidiaNimModel: "nvidia/nemotron-3-ultra-550b-a55b"
  nvidiaNimFallbackModel: ""
  nvidiaNimEnableThinking: "false"
  modelsCorpApiKey: ""
  modelsCorpUrl: ""
  anthropicApiKey: ""
  vertexProjectId: ""
  vertexRegion: ""
