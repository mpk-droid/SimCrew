{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "simcrew.serviceAccountName" . }}
  labels:
    {{- include "simcrew.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "simcrew.fullname" . }}-agents
  labels:
    {{- include "simcrew.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "simcrew.fullname" . }}-agents
  labels:
    {{- include "simcrew.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "simcrew.fullname" . }}-agents
subjects:
  - kind: ServiceAccount
    name: {{ include "simcrew.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
