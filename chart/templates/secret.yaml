apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simcrew.fullname" . }}
  labels:
    {{- include "simcrew.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "simcrew.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.vertexProjectId }}
  ANTHROPIC_VERTEX_PROJECT_ID: {{ .Values.secrets.vertexProjectId | quote }}
  {{- end }}
  {{- if .Values.secrets.vertexRegion }}
  CLOUD_ML_REGION: {{ .Values.secrets.vertexRegion | quote }}
  {{- end }}
  {{- if .Values.secrets.modelsCorpApiKey }}
  MODELS_CORP_API_KEY: {{ .Values.secrets.modelsCorpApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.modelsCorpUrl }}
  MODELS_CORP_URL: {{ .Values.secrets.modelsCorpUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.nvidiaApiKey }}
  NVIDIA_API_KEY: {{ .Values.secrets.nvidiaApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.nvidiaNimBaseUrl }}
  NVIDIA_NIM_BASE_URL: {{ .Values.secrets.nvidiaNimBaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.nvidiaNimModel }}
  NVIDIA_NIM_MODEL: {{ .Values.secrets.nvidiaNimModel | quote }}
  {{- end }}

  {{- if .Values.secrets.nvidiaNimFallbackModel }}
  NVIDIA_NIM_FALLBACK_MODEL: {{ .Values.secrets.nvidiaNimFallbackModel | quote }}
  {{- end }}
  {{- if .Values.secrets.nvidiaNimEnableThinking }}
  NVIDIA_NIM_ENABLE_THINKING: {{ .Values.secrets.nvidiaNimEnableThinking | quote }}
  {{- end }}
