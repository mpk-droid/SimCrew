{{- $dbPassword := include "simcrew.dbPassword" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simcrew.fullname" . }}
  labels:
    {{- include "simcrew.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  POSTGRESQL_PASSWORD: {{ $dbPassword | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $dbPassword (include "simcrew.postgresqlName" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "externalDatabaseUrl is required when postgresql.enabled is false" .Values.externalDatabaseUrl | quote }}
  {{- end }}
  {{- with .Values.secrets }}
  {{- if .nvidiaApiKey }}
  NVIDIA_API_KEY: {{ .nvidiaApiKey | quote }}
  {{- end }}
  {{- if .nvidiaNimBaseUrl }}
  NVIDIA_NIM_BASE_URL: {{ .nvidiaNimBaseUrl | quote }}
  {{- end }}
  {{- if .nvidiaNimModel }}
  NVIDIA_NIM_MODEL: {{ .nvidiaNimModel | quote }}
  {{- end }}
  {{- if .nvidiaNimFallbackModel }}
  NVIDIA_NIM_FALLBACK_MODEL: {{ .nvidiaNimFallbackModel | quote }}
  {{- end }}
  {{- if .nvidiaNimEnableThinking }}
  NVIDIA_NIM_ENABLE_THINKING: {{ .nvidiaNimEnableThinking | quote }}
  {{- end }}
  {{- if .modelsCorpApiKey }}
  MODELS_CORP_API_KEY: {{ .modelsCorpApiKey | quote }}
  {{- end }}
  {{- if .modelsCorpUrl }}
  MODELS_CORP_URL: {{ .modelsCorpUrl | quote }}
  {{- end }}
  {{- if .anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .anthropicApiKey | quote }}
  {{- end }}
  {{- if .vertexProjectId }}
  ANTHROPIC_VERTEX_PROJECT_ID: {{ .vertexProjectId | quote }}
  {{- end }}
  {{- if .vertexRegion }}
  CLOUD_ML_REGION: {{ .vertexRegion | quote }}
  {{- end }}
  {{- end }}
