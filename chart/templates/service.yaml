apiVersion: v1
kind: Service
metadata:
  name: {{ include "simcrew.fullname" . }}
  labels:
    {{- include "simcrew.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    {{- include "simcrew.selectorLabels" . | nindent 4 }}
