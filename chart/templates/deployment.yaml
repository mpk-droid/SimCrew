apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simcrew.fullname" . }}
  labels:
    {{- include "simcrew.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "simcrew.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "simcrew.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "simcrew.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SU_ROLE
              value: orchestrator
            - name: SU_ORCHESTRATOR
              value: "kubernetes"
            - name: SU_AGENT_IMAGE
              value: {{ .Values.agent.image | default (printf "%s:%s" .Values.image.repository .Values.image.tag) | quote }}
            - name: SU_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SU_K8S_SECRET
              value: {{ include "simcrew.fullname" . }}
            - name: SU_ORCHESTRATOR_HOST
              value: "{{ include "simcrew.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local"
          envFrom:
            - secretRef:
                name: {{ include "simcrew.fullname" . }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
