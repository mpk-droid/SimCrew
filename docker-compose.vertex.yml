# Vertex AI via gcloud application default credentials:
#   gcloud auth application-default login
#   docker compose -f docker-compose.yml -f docker-compose.vertex.yml up --build
services:
  app:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
      SU_GCP_CREDENTIALS_HOST_PATH: ${HOME}/.config/gcloud/application_default_credentials.json
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
