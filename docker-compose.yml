name: simcrew

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synthetic_users
      POSTGRES_USER: synthetic
      POSTGRES_PASSWORD: synthetic
    ports:
      - "127.0.0.1:${SIMCREW_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetic -d synthetic_users"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simcrew:latest
    # Root so the orchestrator can use the host Docker socket on Linux too.
    user: "0"
    ports:
      - "${SIMCREW_PORT:-8000}:8000"
    environment:
      SU_ROLE: orchestrator
      DATABASE_URL: postgresql+asyncpg://synthetic:synthetic@db:5432/synthetic_users
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      NVIDIA_NIM_FALLBACK_MODEL: ${NVIDIA_NIM_FALLBACK_MODEL:-}
      MODELS_CORP_API_KEY: ${MODELS_CORP_API_KEY:-}
      MODELS_CORP_URL: ${MODELS_CORP_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID:-}
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-us-east5}
      SU_AGENT_IMAGE: simcrew:latest
      SU_DOCKER_NETWORK: simcrew
      SU_ORCHESTRATOR_HOST: app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  default:
    name: simcrew

volumes:
  pgdata:
